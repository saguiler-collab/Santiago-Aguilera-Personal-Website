<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:"Newsreader"; src:url("FONTS/Newsreader-Variable.ttf") format("truetype"); font-weight:200 800; }
  @font-face { font-family:"Karla"; src:url("FONTS/Karla-Variable.ttf") format("truetype"); font-weight:200 800; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; }
  .card {
    position:relative; width:1200px; height:630px; overflow:hidden;
    background:radial-gradient(ellipse 120% 90% at 50% 30%,#14454a 0%,#0d3236 38%,#071e21 72%,#041214 100%);
    display:flex; flex-direction:column; justify-content:center;
    padding:0 88px; color:#FDFBF7;
  }
  .glow { position:absolute; border-radius:50%; filter:blur(110px); pointer-events:none; }
  .g1 { width:620px; height:620px; left:46%; top:34%; transform:translate(-50%,-50%); background:#2A9D8F; opacity:.16; }
  .g2 { width:400px; height:400px; left:6%; bottom:-14%; background:#E0654A; opacity:.14; }
  .star { position:absolute; border-radius:50%; background:#FDFBF7; }
  .inner { position:relative; z-index:2; }
  .eyebrow {
    font-family:"Karla",sans-serif; font-weight:600; font-size:19px; letter-spacing:.14em;
    text-transform:uppercase; color:#F0A891;
  }
  h1 {
    font-family:"Newsreader",serif; font-weight:400; font-size:92px; line-height:1.02;
    letter-spacing:-.02em; margin-top:26px;
  }
  p {
    font-family:"Karla",sans-serif; font-weight:400; font-size:27px; line-height:1.45;
    margin-top:26px; max-width:34ch; color:rgba(253,251,247,.80);
  }
  .rule { width:76px; height:3px; background:#E0654A; border-radius:2px; margin-top:38px; }
  .mark { position:absolute; right:82px; bottom:74px; width:150px; height:150px; opacity:.92; z-index:2; }
</style>
</head>
<body>
<div class="card">
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div id="stars"></div>

  <div class="inner">
        <h1>Santiago Aguilera<br>Library</h1>
    <p>Everything six countries left behind. Student, researcher, athlete, musician.</p>
    <div class="rule"></div>
  </div>

  <img class="mark" src="SYMBOL">
</div>
<script>
  // same scatter as the site hero, so the card and the page read as one thing
  var layer = document.getElementById('stars');
  for (var i = 0; i < 70; i++) {
    var s = document.createElement('span');
    s.className = 'star';
    var size = i % 17 === 0 ? 3.2 : i % 6 === 0 ? 2.1 : 1.3;
    var op = i % 17 === 0 ? 0.85 : i % 6 === 0 ? 0.6 : 0.35;
    s.style.width = size + 'px'; s.style.height = size + 'px';
    s.style.left = ((i * 37.7) % 100).toFixed(2) + '%';
    s.style.top = ((i * 61.3) % 100).toFixed(2) + '%';
    s.style.opacity = op;
    if (size > 2) s.style.boxShadow = '0 0 ' + (size * 2.5).toFixed(1) + 'px rgba(253,251,247,.7)';
    layer.appendChild(s);
  }
</script>
</body>
</html>
