<!--
  Deliberately plain HTML: no React, no dc-runtime, no client-side rendering. Every
  other page on this site paints only after JavaScript boots, and a 404 that could
  itself fail to render is a dead end with no way out. This one is just markup and a
  stylesheet, so it works even when everything else is broken.

  Asset paths are root-relative because a static host serves this file for any
  unmatched URL, including nested ones like /academics/perkiomen. Relative paths
  would resolve against that missing directory and 404 in turn.
-->
