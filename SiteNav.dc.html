<body>
<x-dc>
<helmet>

<header style="position:sticky;top:0;z-index:20;background:color-mix(in oklab, var(--sa-surface-page) 82%, transparent);backdrop-filter:var(--sa-blur-veil);-webkit-backdrop-filter:var(--sa-blur-veil);border-bottom:1px solid var(--sa-border-hairline)">

    <a href="Home.dc.html" style="display:inline-flex;align-items:center;gap:var(--sa-space-3);text-decoration:none;color:var(--sa-text-primary)">
      <svg viewBox="-306 -318 612 590" style="height:30px;width:auto;display:block;flex:none;overflow:visible" fill="none" stroke="currentColor" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Santiago Aguilera">

        <path stroke-width="36" d="M -208 -216 L -285 -295"></path>
        <path stroke-width="36" d="M 208 -216 L 285 -295"></path>
      </svg>
      <span style="font-family:var(--sa-font-display);font-size:var(--sa-text-md);letter-spacing:var(--sa-tracking-tight)">Santiago Aguilera</span>
    </a>
    <div style="display:flex;align-items:center;gap:var(--sa-space-1);margin-left:auto;flex-wrap:wrap">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
        <a href="{{ l.href }}" style="position:relative;padding:8px 12px;font:var(--sa-type-ui);text-decoration:none;color:{{ l.color }};border-radius:var(--sa-radius-pill);transition:var(--sa-transition-control)" style-hover="color:var(--sa-text-primary)">

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;academics&quot;,&quot;research&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const ITEMS = [
  { id: "home", label: "Home", href: "Home.dc.html" },
  { id: "about", label: "About me", href: "About.dc.html" },
  { id: "academics", label: "Academics", href: "Academics.dc.html" },
  { id: "research", label: "Research & projects", href: "Research.dc.html" }
];

class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || "home";
    return {
      links: ITEMS.map(it => ({
        ...it,
        color: it.id === active ? "var(--sa-text-primary)" : "var(--sa-text-muted)",
        underline: it.id === active ? 1 : 0
      }))
    };
  }
}
</script>
</body>
</html>
