<body>

</helmet>
<header style="position:sticky;top:0;z-index:20;background:color-mix(in oklab, var(--sa-surface-page) 82%, transparent);backdrop-filter:var(--sa-blur-veil);-webkit-backdrop-filter:var(--sa-blur-veil);border-bottom:1px solid var(--sa-border-hairline)">
  <nav style="max-width:1440px;margin:0 auto;padding:var(--sa-space-4) clamp(16px,5vw,64px) var(--sa-space-4) clamp(16px,11vw,168px);display:flex;align-items:center;gap:var(--sa-space-4)">

        <path transform="translate(26 0) rotate(-90)" d="M 0 -20 C 5.2 -24.3, 14.1 -26.2, 23.2 -23.2 C 32.3 -20.1, 41.3 -11.9, 45.6 0 C 49.8 11.9, 49 27.4, 41.2 41.2 C 33.5 55.1, 18.6 66.9, 0 71.1 C -18.6 75.4, -40.8 71.8, -59.3 59.3 C -77.9 46.8, -92.4 25.3, -96.7 0 C -100.9 -25.3, -94.6 -54.1, -77.4 -77.4 C -60.1 -100.7, -32 -118, 0 -122.2 C 32 -126.5, 67.5 -117.4, 95.5 -95.5 C 123.5 -73.5, 143.5 -38.7, 147.8 0 C 152 38.7, 140.2 80.8, 113.5 113.5 C 86.8 146.3, 45.4 169.1, 0 173.3 C -45.4 177.6, -94.1 163, -131.6 131.6 C -169.1 100.2, -194.6 52.1, -198.9 0 C -203.1 -52.1, -185.8 -107.5, -149.7 -149.7 C -113.5 -191.9, -58.8 -220.2, 0 -224.4 C 58.8 -228.7, 120.8 -208.6, 167.7 -167.7 C 214.7 -126.8, 245.7 -65.4, 250 0"></path>
        <path stroke-width="36" d="M -208 -216 L -285 -295"></path>
        <path stroke-width="36" d="M 208 -216 L 285 -295"></path>
      </svg>
      <span style="font-family:var(--sa-font-display);font-size:var(--sa-text-md);letter-spacing:var(--sa-tracking-tight)">Santiago Aguilera</span>

    <div class="sa-nav-scroll" style="display:flex;align-items:center;gap:2px;margin-left:auto;padding:6px;background:var(--sa-surface-tint);border-radius:var(--sa-radius-pill);flex-wrap:nowrap;overflow-x:auto;min-width:0;-webkit-overflow-scrolling:touch">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">

    <button ref="{{ themeBtn }}" type="button" aria-label="Toggle dark mode" style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border-radius:999px;border:1px solid var(--sa-border-default);background:var(--sa-surface-card);color:var(--sa-text-secondary);cursor:pointer;transition:var(--sa-transition-control)"></button>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;academics&quot;,&quot;research&quot;,&quot;beyond&quot;,&quot;curiosities&quot;,&quot;media&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const ITEMS = [
  { id: "home", label: "Home", href: "Home.dc.html" },
  { id: "about", label: "About", href: "About.dc.html" },
  { id: "academics", label: "Academics", href: "Academics.dc.html" },
  { id: "research", label: "Research", href: "Research.dc.html" },
  { id: "beyond", label: "Beyond", href: "Beyond.dc.html" },
  { id: "curiosities", label: "Curiosities", href: "Curiosities.dc.html" },
  { id: "media", label: "Media", href: "Media.dc.html" }
];

const SUN_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.4M12 19.1v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"></path></svg>';
const MOON_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"></path></svg>';

function isDarkNow() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t === "dark") return true;
  if (t === "light") return false;
  return matchMedia("(prefers-color-scheme: dark)").matches;
}

class Component extends DCLogic {
  renderVals() {
    const r = k => (this[k] = this[k] || React.createRef());
    const active = this.props.active || "home";
    return {
      themeBtn: r("_themeBtn"),
      links: ITEMS.map(it => {
        const isActive = it.id === active;
        return {
          ...it,
          color: isActive ? "var(--sa-text-primary)" : "var(--sa-text-muted)",
          bg: isActive ? "var(--sa-surface-card)" : "transparent",
          shadow: isActive ? "var(--sa-shadow-1)" : "none"
        };
      })
    };
  }

  componentDidMount() {
    const btn = this._themeBtn.current;
    if (!btn) return;
    const paint = () => {
      const dark = isDarkNow();
      btn.innerHTML = dark ? SUN_SVG : MOON_SVG;
      btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    };
    this._onClick = () => {
      const next = isDarkNow() ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("sa:theme", next); } catch (e) {}
      paint();
    };
    btn.addEventListener("click", this._onClick);
    paint();
  }

  componentWillUnmount() {
    if (this._themeBtn.current) this._themeBtn.current.removeEventListener("click", this._onClick);
  }
}
</script>
</body>
</html>
