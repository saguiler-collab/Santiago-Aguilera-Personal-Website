<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/santiago-aguilera-design-system-9830153d-9277-4c73-8263-d161c385797f/styles.css">
<script src="_ds/santiago-aguilera-design-system-9830153d-9277-4c73-8263-d161c385797f/_ds_bundle.js"></script>
</helmet>
<div ref="{{ rootRef }}" style="position:fixed;inset:0;z-index:6;pointer-events:none;contain:strict">
  <svg ref="{{ svgRef }}" style="position:absolute;inset:0;width:100%;height:100%;display:block;color:var(--sa-text-primary)" fill="none" preserveAspectRatio="none" aria-hidden="true">
    <g ref="{{ decoRef }}"></g>
    <path ref="{{ strandB }}" fill="none" stroke="currentColor" stroke-opacity="0.16" stroke-width="1.6" stroke-linecap="round" style="opacity:0"></path>
    <path ref="{{ strandA }}" fill="none" stroke="currentColor" stroke-opacity="0.32" stroke-width="2.6" stroke-linecap="round"></path>
    <path ref="{{ coralRef }}" fill="none" stroke="var(--sa-text-accent)" stroke-width="1.8" stroke-linecap="round" style="opacity:0"></path>
    <g ref="{{ markRef }}" stroke="currentColor" stroke-opacity="0.32" stroke-width="2.3" stroke-linecap="round">
      <path ref="{{ eyeL }}"></path>
      <path ref="{{ eyeR }}"></path>
    </g>
    <path ref="{{ arrowA }}" fill="none" stroke="var(--sa-text-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="opacity:0"></path>
    <path ref="{{ arrowB }}" fill="none" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="opacity:0"></path>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;unwind&quot;,&quot;helix&quot;],&quot;default&quot;:&quot;unwind&quot;,&quot;tsType&quot;:&quot;\&quot;unwind\&quot; | \&quot;helix\&quot;&quot;}}">
const N = 150, LAG = 0.52, TH = 2.25 * Math.PI * 2;
const cl = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const BASES = ["G", "A", "C", "T"];
const sy = () => window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;

class Component extends DCLogic {
  renderVals() {
    const r = k => (this[k] = this[k] || React.createRef());
    return { rootRef: r("_root"), svgRef: r("_svg"), strandA: r("_a"), strandB: r("_b"), coralRef: r("_c"),
      decoRef: r("_deco"), markRef: r("_mark"), eyeL: r("_eL"), eyeR: r("_eR"), arrowA: r("_arA"), arrowB: r("_arB") };
  }

  componentDidMount() {
    this.p = 0; this.pTarget = 0; this.ay = [0, 0]; this.ax = [0, 0]; this.targets = []; this.drawn = false;
    this.reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.onScroll = () => { this.dirty = true; this.step(); this.kick(); };
    this.onResize = () => { this.measure(); this.scan(); this.dirty = true; this.step(); this.kick(); };
    this.onVis = () => { if (!document.hidden) { this.dirty = true; this.step(); this.kick(); } };
    addEventListener("scroll", this.onScroll, { passive: true });
    addEventListener("resize", this.onResize, { passive: true });
    document.addEventListener("visibilitychange", this.onVis);
    this.measure(); this.scan(); this.buildDeco();
    this._t = setTimeout(() => { this.scan(); this.dirty = true; this.step(); }, 600);
    // fallback: keeps the rail correct if rAF is throttled (hidden tab, offscreen frame)
    this._poll = setInterval(() => {
      if (this.dirty || Math.abs(this.p - this.pTarget) > 0.0004) this.step();
      this.kick();
    }, 200);
    this.dirty = true; this.step(); this.kick();
  }

  componentWillUnmount() {
    removeEventListener("scroll", this.onScroll); removeEventListener("resize", this.onResize);
    document.removeEventListener("visibilitychange", this.onVis);
    cancelAnimationFrame(this._raf); clearTimeout(this._t); clearInterval(this._poll);
    this._raf = null;
  }

  kick() { if (!this._raf) this.frame(); }

  frame() {
    this._raf = requestAnimationFrame(() => { this._raf = null; this.frame(); });
    this.step();
  }

  measure() {
    this.W = innerWidth; this.H = innerHeight;
    this.hidden = this.W < 860;
    this.narrow = this.W < 1120;
    const svg = this._svg.current;
    if (svg) { svg.setAttribute("viewBox", `0 0 ${this.W} ${this.H}`); svg.style.opacity = this.hidden ? "0" : "1"; }
    this.cx = this.narrow ? 58 : 72;
    this.R = this.narrow ? 25 : 30; this.r0 = this.R * 0.08;
    this.yTop = this.H * 0.1; this.yBot = this.H * 0.92; this.cy = this.H * 0.34;
  }

  scan() {
    const y = sy();
    this.targets = [...document.querySelectorAll("[data-rail-target]")].map(el => {
      const b = el.getBoundingClientRect();
      return { top: b.top + y, left: b.left, h: b.height };
    });
    this.buildDeco();
  }

  buildDeco() {
    const g = this._deco.current;
    if (!g) return;
    g.replaceChildren();
    const mk = (t, at) => { const e = document.createElementNS("http://www.w3.org/2000/svg", t); for (const k in at) e.setAttribute(k, at[k]); g.appendChild(e); return e; };
    if (this.props.mode === "helix") {
      this.rungs = [];
      for (let i = 0; i < 22; i++) this.rungs.push({
        line: mk("line", { stroke: i % 4 === 0 ? "var(--sa-text-accent)" : "currentColor", "stroke-opacity": i % 4 === 0 ? 0.5 : 0.22, "stroke-width": 1.4 }),
        txt: Object.assign(mk("text", { fill: "var(--sa-text-muted)", "font-size": 9, "font-family": "var(--sa-font-body)", "letter-spacing": "0.1em" }), { textContent: BASES[i % 4] })
      });
    } else {
      this.ticks = this.targets.map(() => mk("line", { stroke: "currentColor", "stroke-opacity": 0.22, "stroke-width": 1.4 }));
    }
  }

  spiral(u) {
    const th = u * TH, r = this.r0 + (this.R - this.r0) * th / TH, a = th - Math.PI / 2;
    return [this.cx + r * Math.sin(a), this.cy - r * Math.cos(a)];
  }

  step() {
    if (!this._a || !this._a.current) return;
    if (!this.W || innerWidth !== this.W || innerHeight !== this.H) { this.measure(); this.scan(); this.dirty = true; }
    const H = this.H, Y = sy();
    this.pTarget = cl(Y / (H * 0.85), 0, 1);
    const settled = Math.abs(this.p - this.pTarget) < 0.0004;
    if (this.reduce || settled) this.p = this.pTarget;
    else this.p += (this.pTarget - this.p) * 0.14;
    if (settled && !this.dirty && this.drawn) { this.arrows(Y); return; }
    this.dirty = false; this.drawn = true;
    if (this.hidden) return;

    const p = this.p, helix = this.props.mode === "helix";
    const phase = helix ? Y * 0.0042 : 0, amp = this.narrow ? 20 : 24, w = 0.021;
    let dA = "", dB = "";
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const [sx, sv] = this.spiral(u);
      const ty = this.yBot + (this.yTop - this.yBot) * u;
      const tx = helix ? this.cx + amp * Math.sin(w * ty + phase) : this.cx;
      const pu = ease(cl((p - (1 - u) * LAG) / (1 - LAG), 0, 1));
      dA += (i ? "L" : "M") + (sx + (tx - sx) * pu).toFixed(1) + " " + (sv + (ty - sv) * pu).toFixed(1) + " ";
      if (helix) dB += (i ? "L" : "M") + (this.cx + amp * Math.sin(w * ty + phase + Math.PI)).toFixed(1) + " " + ty.toFixed(1) + " ";
    }
    this._a.current.setAttribute("d", dA);
    this._a.current.setAttribute("stroke-width", (2.6 - 1.0 * p).toFixed(2));
    if (helix) { this._b.current.setAttribute("d", dB); this._b.current.style.opacity = (p * 0.9).toFixed(2); }

    const fade = cl(1 - p * 2.4, 0, 1), mk = this._mark.current;
    mk.style.opacity = fade.toFixed(2);
    mk.setAttribute("stroke-width", (2.3 - 0.7 * (1 - fade)).toFixed(2));
    if (fade > 0) {
      const k = this.R / 250;
      const set = (ref, sign) => {
        const a = (-90 + sign * 43.9) * Math.PI / 180;
        const i0 = 300 * k + 8 * (1 - fade), i1 = 410 * k + 22 * (1 - fade);
        ref.current.setAttribute("d", `M ${(this.cx + Math.cos(a) * i0).toFixed(1)} ${(this.cy + Math.sin(a) * i0).toFixed(1)} L ${(this.cx + Math.cos(a) * i1).toFixed(1)} ${(this.cy + Math.sin(a) * i1).toFixed(1)}`);
      };
      set(this._eL, -1); set(this._eR, 1);
    }

    const doc = Math.max(1, document.documentElement.scrollHeight - H);
    const prog = cl(Y / doc, 0, 1);
    const c = this._c.current;
    c.style.opacity = (cl((p - 0.55) / 0.35, 0, 1) * 0.95).toFixed(2);
    if (helix) {
      let dc = "";
      const yEnd = this.yTop + (this.yBot - this.yTop) * prog;
      for (let i = 0; i <= 40; i++) { const y = this.yTop + (yEnd - this.yTop) * i / 40; dc += (i ? "L" : "M") + (this.cx + amp * Math.sin(w * y + phase)).toFixed(1) + " " + y.toFixed(1) + " "; }
      c.setAttribute("d", dc);
    } else {
      c.setAttribute("d", `M ${this.cx} ${this.yTop} L ${this.cx} ${(this.yTop + (this.yBot - this.yTop) * prog).toFixed(1)}`);
    }

    if (helix && this.rungs) {
      const o = cl((p - 0.5) / 0.4, 0, 1);
      this.rungs.forEach((r, i) => {
        const y = this.yTop + (this.yBot - this.yTop) * (i + 0.5) / this.rungs.length;
        const x1 = this.cx + amp * Math.sin(w * y + phase), x2 = this.cx + amp * Math.sin(w * y + phase + Math.PI);
        const sp = Math.abs(x1 - x2) / (2 * amp);
        r.line.setAttribute("x1", x1.toFixed(1)); r.line.setAttribute("x2", x2.toFixed(1));
        r.line.setAttribute("y1", y.toFixed(1)); r.line.setAttribute("y2", y.toFixed(1));
        r.line.style.opacity = (o * (0.35 + 0.65 * sp)).toFixed(2);
        r.txt.setAttribute("x", (this.cx + amp + 12).toFixed(1)); r.txt.setAttribute("y", (y + 3).toFixed(1));
        r.txt.style.opacity = (o * sp * 0.9).toFixed(2);
      });
    }
    if (this.ticks) {
      const o = cl((p - 0.6) / 0.3, 0, 1);
      const tip = this.tip();
      this.ticks.forEach((t, i) => {
        const y = this.targets[i] ? this.targets[i].top - Y + 12 : -50;
        const on = y > this.yTop - 4 && y < this.yBot + 4;
        // a tick lights up at the exact frame the coral tip reaches it
        const passed = y <= tip;
        const half = passed ? 7 : 5;
        t.setAttribute("x1", this.cx - half); t.setAttribute("x2", this.cx + half);
        t.setAttribute("y1", y.toFixed(1)); t.setAttribute("y2", y.toFixed(1));
        t.setAttribute("stroke", passed ? "var(--sa-text-accent)" : "currentColor");
        t.setAttribute("stroke-opacity", passed ? 0.95 : 0.22);
        t.setAttribute("stroke-width", passed ? 2.2 : 1.4);
        t.style.opacity = on ? (o * 0.9).toFixed(2) : "0";
      });
    }
    this.arrows(Y);
  }

  /**
   * Y of the coral progress line's leading tip, in viewport coordinates.
   *
   * This is the one number the rail's "have we reached this section yet?" state must key
   * off. It is deliberately recomputed from live scroll rather than cached, because
   * arrows() also runs on the settled/early-return path where step() has not redrawn.
   *
   * Note the tip is driven by document scroll fraction mapped onto the yTop..yBot band,
   * so it travels DOWN the viewport while section markers travel UP — they cross exactly
   * once per section, which is what makes `markerY <= tip` a stable, flicker-free test.
   */
  tip() {
    const doc = Math.max(1, document.documentElement.scrollHeight - this.H);
    return this.yTop + (this.yBot - this.yTop) * cl(sy() / doc, 0, 1);
  }

  arrows(Y) {
    if (this.hidden || !this.targets.length || !this._arA.current) return;
    // active section = the last one the coral tip has actually reached, so the arrow
    // switches at the same instant the line touches it (previously this used a fixed
    // 42%-of-viewport threshold, which drifted out of sync with the line by a long way)
    const tip = this.tip();
    let act = -1;
    this.targets.forEach((t, i) => { if (t.top - Y + 14 <= tip) act = i; });
    const pick = [act, act + 1];
    [this._arA, this._arB].forEach((ref, k) => {
      const t = this.targets[pick[k]];
      const el = ref.current;
      if (!t || this.p < 0.6) { el.style.opacity = "0"; return; }
      const y = t.top - Y + 14, x = Math.max(this.cx + 26, t.left - 34);
      const vis = y > 40 && y < this.H - 30 ? (k ? 0.4 : 1) : 0;
      const dy = this.ay[k] || y, dx = this.ax[k] || x;
      const ny = this.reduce ? y : dy + (y - dy) * 0.18, nx = this.reduce ? x : dx + (x - dx) * 0.2;
      this.ay[k] = ny; this.ax[k] = nx;
      const s = k ? 5 : 6.5;
      el.setAttribute("d", `M ${(nx - s * 2.2).toFixed(1)} ${ny.toFixed(1)} L ${nx.toFixed(1)} ${ny.toFixed(1)} M ${(nx - s).toFixed(1)} ${(ny - s * 0.72).toFixed(1)} L ${nx.toFixed(1)} ${ny.toFixed(1)} L ${(nx - s).toFixed(1)} ${(ny + s * 0.72).toFixed(1)}`);
      el.style.opacity = (vis * cl((this.p - 0.6) / 0.25, 0, 1)).toFixed(2);
    });
  }
}
</script>
</body>
</html>
