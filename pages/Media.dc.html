<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() { return {}; }

  componentDidMount() {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.style.transition = "opacity 560ms cubic-bezier(.22,.61,.36,1), transform 560ms cubic-bezier(.22,.61,.36,1)";
      e.target.style.opacity = "1"; e.target.style.transform = "none";
      io.unobserve(e.target);
    }), { threshold: 0.05 });
    if (!reduce) document.querySelectorAll("[data-reveal]").forEach(el => {
      el.style.opacity = "0"; el.style.transform = "translateY(12px)"; io.observe(el);
    });
    this._io = io;

    // filters: plain data-attribute driven, no framework state
    const buttons = [...document.querySelectorAll("[data-filter-btn]")];
    const tiles = [...document.querySelectorAll("[data-media-tile]")];
    const paint = (name) => {
      buttons.forEach(b => {
        const on = b.dataset.filterBtn === name;
        b.setAttribute("aria-pressed", on ? "true" : "false");
        b.classList.toggle("on", on);
      });
      tiles.forEach(t => { t.hidden = !(name === "all" || t.dataset.cat === name); });
    };
    this._onFilter = (e) => paint(e.currentTarget.dataset.filterBtn);
    buttons.forEach(b => b.addEventListener("click", this._onFilter));
    paint("all");

    // lightbox: the full-size photo (or the video), with previous / next across whatever is
    // currently filtered in
    const lb = document.getElementById("media-lightbox");
    const body = document.getElementById("media-lightbox-body");
    const tag = document.getElementById("media-lightbox-tag");
    const cap = document.getElementById("media-lightbox-caption");
    const count = document.getElementById("media-lightbox-count");
    let current = -1, lastFocus = null;
    const visible = () => tiles.filter(t => !t.hidden);
    const show = (tile) => {
      const list = visible(); current = list.indexOf(tile);
      body.innerHTML = "";
      if (tile.dataset.video) {
        const v = document.createElement("video");
        v.src = tile.dataset.video; v.poster = tile.dataset.full || ""; v.controls = true; v.playsInline = true; v.autoplay = true;
        body.appendChild(v);
      } else {
        const img = document.createElement("img");
        img.src = tile.dataset.full; img.alt = tile.dataset.label;
        body.appendChild(img);
      }
      tag.textContent = tile.dataset.tag; cap.textContent = tile.dataset.label;
      count.textContent = (current + 1) + " / " + list.length;
    };
    const open = (tile) => { lastFocus = document.activeElement; lb.classList.add("open"); document.body.style.overflow = "hidden"; show(tile); document.getElementById("media-lightbox-close").focus(); };
    const close = () => { lb.classList.remove("open"); body.innerHTML = ""; document.body.style.overflow = ""; if (lastFocus && lastFocus.focus) lastFocus.focus(); };
    const step = (d) => { const list = visible(); if (!list.length) return; show(list[(current + d + list.length) % list.length]); };
    this._onTile = (e) => open(e.currentTarget);
    this._onTileKey = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(e.currentTarget); } };
    tiles.forEach(t => { t.addEventListener("click", this._onTile); t.addEventListener("keydown", this._onTileKey); });
    this._close = close; this._prev = () => step(-1); this._next = () => step(1);
    document.getElementById("media-lightbox-close").addEventListener("click", this._close);
    document.getElementById("media-lightbox-prev").addEventListener("click", this._prev);
    document.getElementById("media-lightbox-next").addEventListener("click", this._next);
    this._onBackdrop = (e) => { if (e.target === lb) close(); };
    lb.addEventListener("click", this._onBackdrop);
    this._onKey = (e) => {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1);
    };
    document.addEventListener("keydown", this._onKey);
  }

  componentWillUnmount() {
    if (this._io) this._io.disconnect();
    document.removeEventListener("keydown", this._onKey);
    document.body.style.overflow = "";
  }
}
</script>
